# Sanity checks on every push/PR: suite pricing math, data-file shape,
# version-stamp consistency, download links, and PDF form fields.
name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python3 tools/check_site.py
