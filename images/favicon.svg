<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Courthouse Square favicon: evergreen tile, serif CS monogram, and the
       wordmark's dot-and-rule motif. -->
  <rect width="64" height="64" rx="12" fill="#1e3128"/>
  <circle cx="32" cy="12" r="2.4" fill="#f3ece0"/>
  <text x="32" y="42" font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="600" letter-spacing="1"
        text-anchor="middle" fill="#f3ece0">CS</text>
  <line x1="16" y1="50" x2="48" y2="50" stroke="#f3ece0" stroke-width="2"/>
</svg>
