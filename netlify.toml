# Netlify deploy configuration. The site is static — no build step.
# (The Tailwind stylesheet and lease PDFs are prebuilt, committed artifacts.)

# The Burton Inn lease working folder is a confidential deal draft, not site
# content. Force-redirect it away so committing it never publishes it.
[[redirects]]
  from = "/burton-inn/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for the fingerprint-free static assets that change rarely.
# max-age is modest (1 day) since filenames aren't hashed.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
