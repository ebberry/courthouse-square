<!doctype html>
<html lang="en">
<head>
  <!-- GENERATED by tools/build_pages.py from tools/templates/listing-fallback.tmpl.html. The header, footer and
       shell styles are copied from index.html (EB:HEADER, EB:FOOTER, EB:SHELL-STYLES). Do not edit by hand:
       change the template, then re-run `python3 tools/build_pages.py`.

       This is the safety net behind the netlify.toml rewrite  /listings/*  ->  /listing.html  (status 200,
       not forced): a listing that is in the live feed but has no generated /listings/<id>/ page yet lands
       here, and js/listing-detail.js draws the same layout as the generated pages from the feed. -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A place on Vashon — E. Berry Property Management</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/images/brand/monogram-tangerine-badge.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#670A2F" />

  <!-- Prebuilt Tailwind stylesheet (generated from tailwind.config.js + tools/tailwind.src.css;
       see "Rebuilding the stylesheet" in README.md). -->
  <link rel="stylesheet" href="/css/tailwind.css" />
  <!-- Vendored Leaflet 1.9.4, then the E. Berry skin for it. Both local; only the map tiles come from OpenStreetMap. -->
  <link rel="stylesheet" href="/css/vendor/leaflet.css" />
  <link rel="stylesheet" href="/css/eb-map.css" />

  <!-- Fonts: Fraunces (serif body + headings), Inter (small labels), Anton (wordmark-scale display). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=Anton&display=swap" rel="stylesheet" />

  $shell_styles
  <style>
    /* Cream cards sit on colored fields on this page. The shell rule above turns every focus ring inside a
       Berry section Cream, which would vanish on a Cream card, so cards get a Berry ring back. */
    .eb-card :is(a, button, summary, input, select, textarea):focus-visible { outline-color: var(--eb-berry); }
  </style>
  <!-- No-JS fallback: keep the mobile menu open. -->
  <noscript><style>
    @media (max-width: 1023px) { #site-nav { display: flex; } #nav-toggle { display: none; } }
  </style></noscript>
</head>

<body class="bg-eb-cream font-serif text-lg leading-[1.4] text-eb-berry antialiased">

<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-[4px] focus:bg-eb-tangerine focus:px-4 focus:py-2 focus:text-eb-berry">Skip to content</a>

$header

<!-- js/listing-detail.js replaces everything inside <main> once the feed has loaded. -->
<main id="main" class="min-h-[60vh]">
  <section class="bg-eb-cream" aria-labelledby="listing-loading">
    <div class="mx-auto max-w-[1440px] px-[var(--eb-space-margin)] py-[max(4.5rem,calc(var(--eb-space-margin)*1.25))]">
      <p id="listing-loading" role="status" class="font-serif text-2xl leading-[1.25] sm:text-3xl">Finding that place&hellip;</p>
      <noscript>
        <p class="mt-6 max-w-[34rem]">This page needs JavaScript to show the place you asked for. You can still see everything that's open:</p>
        <p class="mt-4"><a href="/listings/" class="text-xl font-semibold text-eb-berry underline decoration-eb-tangerine decoration-2 underline-offset-[6px] hover:decoration-eb-berry">&larr; Everything that's open</a></p>
      </noscript>
    </div>
  </section>
</main>

$footer

<!-- ============================================================
     SCRIPT (vanilla; Leaflet is vendored)
     - Leaflet 1.9.4 and the E. Berry map wrapper
     - window.EB.LISTINGS_URL from /js/site-config.js
     - listing-detail.js: finds the listing, draws the page, builds the map
     - Mobile nav toggle and dynamic copyright year (same as the homepage)
============================================================ -->
<script src="/js/vendor/leaflet.js"></script>
<script src="/js/eb-map.js"></script>
<script src="/js/site-config.js"></script>
<script src="/js/listing-detail.js"></script>
<script>
  // ---- Mobile nav toggle ----
  (function () {
    const btn = document.getElementById('nav-toggle');
    const nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    function setOpen(open) {
      nav.classList.toggle('hidden', !open);
      nav.classList.toggle('flex', open);
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', () => setOpen(btn.getAttribute('aria-expanded') !== 'true'));
    nav.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && btn.getAttribute('aria-expanded') === 'true') { setOpen(false); btn.focus(); }
    });
  })();

  // Copyright year.
  document.getElementById('copyright-year').textContent = new Date().getFullYear();
</script>

</body>
</html>
